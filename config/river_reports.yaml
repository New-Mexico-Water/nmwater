# River settings for the site data bundle (`nmwater export-site-data`).
# Which rivers get a page, and per-river settings. Output goes to dist/rivers/ (not in git).

# The public website the pages are published on. base_url (e.g. https://rivers.example.org/) is needed for
# canonical links, social-share images (og:image) and the sitemap, which must use absolute URLs; until it is
# set those tags are left out. license: a URL for the data licence, added to the pages' Dataset metadata.
site:
  name: New Mexico Water
  base_url: null
  twitter: null
  license: https://creativecommons.org/licenses/by-sa/4.0/
  attribution: New Mexico Water
  attribution_url: https://github.com/New-Mexico-Water

# Rivers with at least this many stream sites carrying daily discharge get a page.
min_sites: 2
# ...and so does a river with fewer, when one of its gauges holds at least this many years of daily values
# (added 2026-09-29: Delaware River, Ponil Creek, Rio Lucero and others have 60-110 year single-gauge records).
min_years_single_gauge: 20

# Rivers never reported (names as in site_reaches.river_name).
exclude: []

# Per-river overrides.
#   states: only gauges in these states (null state counts as NM). Default: every gauge in the archive.
#   notes:  extra lines for the page's "How to read this" and notes.md.
rivers:
  Rio Grande:
    states: [NM]      # chosen 2026-09-26: New Mexico segments only (the full river has 10 segments, the chart shows 8)
    notes:
      - "Reservoirs changed the river over this record: Elephant Butte (1916), El Vado (1935), Caballo (1938), Abiquiu (1963), Cochiti (1975). Compare periods with that in mind."
      - "Elephant Butte Reservoir's segment includes gauges at San Marcial and in the reservoir's Narrows, upstream of the dam. Flow below the dam is reported under Caballo."
