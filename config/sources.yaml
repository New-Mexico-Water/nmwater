# Per-source runtime settings. Keys not listed under defaults become source options.
#
# update: policy for `nmwater update` (the incremental refresh). Omitted means fetch the delta with
# the source's default kinds, starting --margin-days before its last successful fetch.
#   skip: true, reason: "..."   not fetched by update (reference layers, static or blocked sources)
#   kinds: [...]                 which data kinds an update covers
defaults:
  concurrency: 2
  min_interval_s: 0.5
  timeout_s: 180
  max_retries: 5

sources:
  usgs:
    update: {kinds: [daily, gwlevels, peaks, measurements, continuous]}   # continuous is opt-in for plain fetch
    # Measured 2026-09-13 with a registered key: x-ratelimit-limit = 1000 requests/hour.
    # 2 workers x 4 s spacing sustains ~900/hour and never trips the limit. The retry layer
    # still backs off on 429. Legacy WaterServices (bulk RDB) is not metered this way.
    concurrency: 2
    min_interval_s: 4.0
    timeout_s: 900
    token_env: [USGS_API_KEY]
    ogc_base: https://api.waterdata.usgs.gov/ogcapi/v1
    legacy_base: https://nwis.waterservices.usgs.gov/nwis
    # daily-value parameter codes to pull statewide (others are pulled per allow-listed site)
    daily_params: ["00060", "00065", "00054", "00062", "00045", "00010", "00011", "72019", "62610", "62611",
                   "62614", "00095", "80154", "80155", "63680", "00300", "00400", "72020", "30208", "00020",
                   "00021", "00036", "00052", "00035", "00025", "72036", "72037", "72038", "72039", "72040",
                   "72041", "00046", "00090", "00480", "72137", "72138", "72139", "00050", "00061"]
    include_continuous: false      # 15-minute data: opt in with `nmwater fetch usgs --kind continuous`
    # Default horizon for the 15-minute archive. The full record starts 2007-10-01 and is
    # 250-500 million rows; one year covers the usual operational questions. Override per run
    # with --since / --until, which the ledger makes cheap to extend later.
    continuous_years: 1
    continuous_params: ["00060", "00065", "00054", "00062", "00045", "00010", "72019", "62610", "62611", "00095"]
    continuous_window_days: 1000

  usbr_hydrodata:
    concurrency: 3
    min_interval_s: 0.3
    base_url: https://www.usbr.gov/uc/water/hydrodata

  usbr_rise:
    update: {kinds: [data]}                    # survey tables (acap) are static
    concurrency: 2
    min_interval_s: 0.5
    base_url: https://data.usbr.gov/rise/api

  usace_cwms:
    update: {kinds: [data, ratings, levels]}   # tables and pool levels are two requests; keep them current
    concurrency: 3
    min_interval_s: 0.3
    base_url: https://cwms-data.usace.army.mil/cwms-data
    office: SPA

  nrcs:
    concurrency: 3
    min_interval_s: 0.3
    base_url: https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1
    networks: ["SNTL", "SCAN", "SNOW", "COOP", "MPRC", "SNTLT", "MSNT"]
    exclude_networks: ["USGS", "BOR"]      # duplicates of other sources
    extra_hucs: ["1301", "1408"]           # CO headwater stations
    hourly_elements: ["WTEQ", "SNWD", "PREC", "TOBS", "SMS", "STO", "PRCP"]

  noaa_ghcnd:
    concurrency: 4
    min_interval_s: 0.2

  noaa_isd:
    update: {skip: true, reason: "NOAA ISD-Lite stopped: no 2026 files, 2025 files last modified 2025-08-29; successor is GHCNh (docs/TODO.md D8)"}
    concurrency: 3
    min_interval_s: 0.3

  uscrn:
    concurrency: 2

  cocorahs:
    concurrency: 1
    min_interval_s: 1.5
    start_date: "2005-01-01"

  iem_dcp:
    concurrency: 2
    min_interval_s: 0.5
    window_years: 2

  nwps:
    concurrency: 2

  wqp:
    concurrency: 2
    min_interval_s: 1.0
    timeout_s: 900

  nmwdi_st2:
    concurrency: 3
    min_interval_s: 0.2
    base_url: https://st2.newmexicowaterdata.org/FROST-Server/v1.1

  nmed_st2:
    concurrency: 3
    min_interval_s: 0.2
    base_url: https://nmenv.newmexicowaterdata.org/FROST-Server/v1.1

  nmbgmr:
    update: {skip: true, reason: "host unreachable or 403 at last attempt; see docs/TODO.md"}
    concurrency: 2
    min_interval_s: 0.5
    base_url: https://waterdata.nmt.edu/latest

  ose_arcgis:
    concurrency: 2
    min_interval_s: 0.5
    base_url: https://services2.arcgis.com/qXZbWTdPDbTjl7Dy/arcgis/rest/services

  ose_meas:
    concurrency: 1
    min_interval_s: 1.0
    base_url: https://meas.ose.state.nm.us

  isc_sevenrivers:
    concurrency: 2
    base_url: https://nmisc-wf.gladata.com/api

  ose_reports:
    update: {skip: true, reason: "PDF report library; new reports are rare and added by hand"}
    concurrency: 1
    min_interval_s: 1.0
    timeout_s: 600
    verify_ssl: false          # www.ose.nm.gov serves an incomplete TLS chain

  usbr_albuq:
    concurrency: 2
    base_url: https://www.usbr.gov/uc/elpaso/water/RioGrandeProject/RealTimeData

  codwr:
    concurrency: 3
    min_interval_s: 0.3
    base_url: https://dwr.state.co.us/Rest/GET/api/v2
    divisions: [3, 7]

  ibwc:
    concurrency: 1
    min_interval_s: 1.0
    timeout_s: 600
    bulletin_start: 1931
    bulletin_end: 2006

  twdb:
    concurrency: 1
    timeout_s: 900

  ziamet:
    # 2026-09-23: duststorm.nmsu.edu and ziamet.org refused connections; weather.nmsu.edu answered
    # (slowly). Put the working host first; the module still rotates on failure.
    update: {kinds: [daily]}   # rolling 1-5 min feeds failed 94/214 in the first update; capture by hand with --kind feed
    concurrency: 2
    min_interval_s: 0.5
    base_url: https://weather.nmsu.edu

  edi:
    update: {skip: true, reason: "PASTA returned 403; never completed a fetch"}
    concurrency: 2

  bemp:
    update: {skip: true, reason: "public spreadsheets end in 2017; later data is by request"}
    concurrency: 1

  ckan:
    update: {skip: true, reason: "blocked by Cloudflare; see docs/manual_downloads.md"}
    concurrency: 1
    min_interval_s: 1.0
    base_url: https://catalog.newmexicowaterdata.org

  synoptic:
    update: {skip: true, reason: "never completed a fetch; run by hand once the token is confirmed"}
    concurrency: 1
    min_interval_s: 1.0
    token_env: [SYNOPTIC_TOKEN]

  tiger:
    update: {skip: true, reason: "reference boundaries; annual vintage, refresh by hand with --refresh"}
    concurrency: 2
    min_interval_s: 0.5
    timeout_s: 1800
    tiger_year: 2025
    # State-scoped layers are pulled for these neighbours too, so border-county sites resolve.
    tiger_neighbor_states: ["CO", "TX", "AZ", "OK"]

  nhdplus:
    update: {skip: true, reason: "NHDPlus v2 is frozen; river network does not change"}
    concurrency: 2
    min_interval_s: 0.3
    timeout_s: 300          # per-HUC8 geometry query against a WFS can be slow for dense reaches
    # Max distance (metres) to snap a stream/canal/diversion site onto a flowline reach.
    # 500 m tolerates GPS and digitizing offsets without jumping onto the wrong tributary.
    snap_max_distance_m: 500

  nid:
    update: {skip: true, reason: "dam registry changes a few times a year; refresh by hand"}
    concurrency: 1
    timeout_s: 600          # single ~67 MB national CSV
    # Max distance (m) to associate a dam point with the reservoir waterbody it holds back.
    # 3 km covers narrow-canyon dams (Abiquiu, Cochiti) where the dam and the pool centroid
    # are a real distance apart.
    nid_max_distance_m: 3000

  usdm:
    concurrency: 2

  nclimdiv:
    concurrency: 2

  gridmet:
    concurrency: 2
    min_interval_s: 1.0
    timeout_s: 1800

  prism:
    concurrency: 1
    min_interval_s: 2.0
    timeout_s: 1800

  snodas:
    concurrency: 2
    min_interval_s: 1.0
    timeout_s: 1800
  wbd:
    update: {skip: true, reason: "watershed boundaries are frozen"}
  ua_swe:
    update: {skip: true, reason: "dataset ends WY2023; nothing new to fetch"}
  resopsus:
    update: {skip: true, reason: "static Zenodo release ending 2020"}
  usgs_wateruse:
    update: {skip: true, reason: "five-year compilations; refresh when a new edition is released"}
  nass:
    update: {skip: true, reason: "census cycle; never completed a fetch"}
