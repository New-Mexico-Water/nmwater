  - name: "Abeyta-Trujillo Acequia"
    community: "Abiquiu"
    county: "Rio Arriba"
    stream: null
    evidence: >
      Filed an ICIP Entity Profile as an acequia (Entity Type: AC) with
      NM DFA Local Government Division, FY2023-2027; the Commission has
      resolved to act as fiscal agent for the Rio Chama Acequia
      Association in support of the Rio Chama Irrigation Reserve in El
      Vado Reservoir, and reports evaluating infrastructure needs at an
      annual membership meeting.
    sources: [3]
  - name: "Acequia de Alcalde"
    community: "Alcalde"
    county: "Rio Arriba"
    stream: "Rio Grande"
    evidence: >
      Filed an ICIP Entity Profile as an acequia with NM DFA (county
      given as Rio Arriba). Its own website states the acequia diverts
      water from the Rio Grande and is governed by an elected mayordomo
      and comisionados, with an annual limpieza (ditch cleaning).
    sources: [3, 9]
  - name: "Acequia de la Isla"
    community: "Ledoux"
    county: "Mora"
    stream: null
    evidence: >
      Filed an ICIP Entity Profile as an acequia with NM DFA. A 1925
      court decree (quiet title suit) binds Acequia de la Isla (40%
      interest) and Acequia de San Jose (60% interest) as joint owners
      of Morphy Lake, which the two acequias built and have worked
      together to maintain for irrigation.
    sources: [3]
