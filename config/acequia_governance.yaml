# Checked 2026-09-28: general statements checked against sources 2, 6, 9, 11, 12; the governance statement was
# reworded ("three commissioners" and "in times of shortage" were not in the cited pages). Acequia entries: names and
# counties matched in the DFA ICIP filings; officers' personal names removed from the evidence text.

# =====================================================================
# Task 3: short general statements about acequias, for the "Culture"
# section. Each statement reflects only what its cited source(s)
# state directly.
# =====================================================================
general:
  - text: >
      Acequias, or community ditches, are recognized under New Mexico law
      as political subdivisions of the state; they were defined as
      political subdivisions of the state in 1965. They are local
      government entities in which owners of water rights govern the
      neighborhood ditch, with the power of eminent domain and authority
      to borrow money and enter into contracts for maintenance and
      improvements, but they cannot levy taxes, so maintenance costs are
      borne by the members served by the ditch.
    sources: [2, 6, 11]
  - text: >
      Each acequia is run by a mayordomo, elected by the local community to
      oversee the operation and maintenance of the ditch, together with
      elected commissioners (comisionados). The mayordomo's work includes
      the annual saca de la acequia (the spring ditch cleaning) and the
      equitable distribution of water; commissioners hold membership
      meetings and manage the acequia's governance and finances. The
      individuals or families with rights to use water from an acequia are
      called parciantes.
    sources: [11, 9]
  - text: >
      Many of New Mexico's acequia associations have existed since the
      Spanish colonial period of the 17th and 18th centuries, and
      historically they were the principal local unit of government for
      distributing and using surface water.
    sources: [2]
  - text: >
      Acequias have centuries-old customs of sharing water between
      acequias on the same stream system, known as "repartimiento."
    sources: [11]
  - text: >
      New Mexico is home to roughly 700 acequias and community ditches
      (the New Mexico Acequia Association's 2024 Congreso packet puts it
      as "over 700"; a 2025 NMAA legislative presentation gives "~700"),
      spanning stream systems that include the Rio Grande and its
      tributaries, the San Juan River, the Rio Chama, the
      Nambe/Pojoaque/Tesuque streams, the Pecos River and Gallinas, the
      Canadian River/Mora, the Rio Pueblo/Rio Embudo, the Jemez River,
      the Rio San Jose, the Hondo River, the Gila River and the Mimbres
      River.
    sources: [4, 11]
  - text: >
      In their respective river basins, acequias manage most of the
      non-Indian surface water rights dedicated to agriculture, and they
      are directly involved in water-right adjudication proceedings and
      settlements in those basins; acequias also have the authority to
      approve or deny applications to transfer or lease their water.
    sources: [11]
  - text: >
      The New Mexico Acequia Commission, established in statute in 1993
      and housed within the Department of Finance and Administration's
      Local Government Division, advises the Governor and the
      Legislature on policy matters affecting acequias; the New Mexico
      Acequia Association, a statewide membership organization founded
      in 1989, works to protect water and strengthen acequia agriculture
      through education and advocacy.
    sources: [11, 1]
  - text: >
      Acequias are classified by the state as "local public bodies"
      (along with land grants, mutual domestic water consumer
      associations and special districts) and are therefore subject to
      the Audit Act's tiered system of financial reporting; acequias can
      also qualify for state financial assistance to cover the cost of
      completing their required audits or agreed-upon-procedures
      engagements.
    sources: [12]

# =====================================================================
# Task 1: sources checked for lists that identify individual acequias
# as organized/active (commissioners, mayordomo, bylaws, annual
# meetings, filings as a political subdivision, or membership in a
# regional acequia association).
# =====================================================================
source_lists:
  - source: 1
    shows: >
      New Mexico Acequia Association home site and staff/contact pages.
      No public directory or member list of individual acequias was
      found on the pages checked (home, contact, staff directory);
      NMAA describes itself as a federation of regional, watershed-based
      acequia associations and invites acequias to submit commissioner
      contact info via an update form, but that form/database was not
      publicly browsable in the pages checked.
    names_individual_acequias: false
    format: "HTML"
    approx_count: null
  - source: 2
    shows: >
      NM Office of the State Engineer / Interstate Stream Commission
      "Acequias/Community Ditches" program overview page. States that
      acequias are political subdivisions of the state and describes ISC
      program support, with links to related resource pages, but the
      page itself is not a browsable directory or list of individual
      acequias.
    names_individual_acequias: false
    format: "HTML"
    approx_count: null
  - source: 3
    shows: >
      NM Department of Finance and Administration, Local Government
      Division, "Infrastructure Capital Improvement Plan FY 2023-2027 -
      Entity Profile for Special Districts" (a compiled PDF of ICIP
      entity-profile filings). Contains 149 individual entity profiles
      for local public bodies statewide (acequias, land grants, mutual
      domestic water associations, soil and water conservation
      districts, etc.); each acequia/community-ditch profile names the
      acequia, its county, its ICIP officer (usually a commissioner),
      and often describes commission/mayordomo activity and annual
      membership meetings as evidence of active governance.
    names_individual_acequias: true
    format: "PDF (one structured entity profile per organization; text-extractable)"
    approx_count: 33
  - source: 4
    shows: >
      New Mexico Acequia Association "Congreso de las Acequias" 2024
      delegate meeting packet (agenda, prior-year minutes, resolutions).
      Lists the Congreso's Tier 1 regional acequia associations (about
      16, e.g. Taos Valley Acequia Association, Rio Chama Acequia
      Association, La Asociacion de las Acequias del Valle de Mora) and
      Tier 2 delegate sub-regions (about 25 named places, e.g. Cerro,
      Questa, Rio Pueblo, Rio Sapello, Rio Mimbres, Upper Rio Pecos,
      Tesuque, Truchas, Tularosa) that send delegates; states New Mexico
      has "over 700 acequias and community ditches." Mostly names
      regional associations and delegate regions rather than individual
      acequias (one exception named directly: "Las Nueve Acequias del
      Rio Grande").
    names_individual_acequias: false
    format: "PDF (text)"
    approx_count: null
  - source: 5
    shows: >
      Taos Valley Acequia Association website. States TVAA supports 54
      acequias (one page: "55 acequias on 6 streams") serving an
      estimated 15,000 parciantes across the Rio Hondo, Rio Lucero, Rio
      Fernando, Rio Pueblo, Rio Chiquito and Rio Grande del Rancho
      systems, with per-stream acequia counts and irrigated acreage, but
      the pages checked (board-members, tvaa, the-taos-valley) did not
      itemize the individual acequia names.
    names_individual_acequias: false
    format: "HTML"
    approx_count: 54
  - source: 6
    shows: >
      Individual community website for Acequia del Cano, hosted by the
      NM Office of the State Engineer under its Acequia Mapping Project
      outreach (ose.nm.gov/NMAC/). Names the acequia's president,
      secretary, treasurer and mayordomo on a Contacts page, and posts
      bylaws and annual/special meeting minutes from 2009 through 2025.
      Only one such OSE-hosted acequia site was found in the pages
      checked; it is not known whether other acequias have sites in this
      same OSE-hosted set.
    names_individual_acequias: true
    format: "HTML (one acequia)"
    approx_count: 1
  - source: 7
    shows: >
      Independent website for Acequia Madre del Rio Lucero y del Arroyo
      Seco (Taos County), publishing current bylaws (with named
      commissioners) and a log of meeting minutes.
    names_individual_acequias: true
    format: "HTML/WordPress (one acequia)"
    approx_count: 1
  - source: 8
    shows: >
      Village of Jemez Springs official government website, "Ditch
      Association" page, naming the Jemez Springs Community Ditch
      Association's mayordomo, president, secretary/treasurer and
      commissioner-at-large as elected at its November 16, 2025 biannual
      meeting.
    names_individual_acequias: true
    format: "HTML (one acequia)"
    approx_count: 1
  - source: 9
    shows: >
      Independent website for Acequia de Alcalde (Rio Arriba County),
      describing governance by mayordomo and comisionados and the annual
      limpieza, and stating the acequia diverts water from the Rio
      Grande.
    names_individual_acequias: true
    format: "HTML (one acequia)"
    approx_count: 1
  - source: 10
    shows: >
      Independent website for Acequia de Santa Cruz, publishing bylaws
      (dated 2018-06-14) and meeting minutes through September 2025, and
      describing the Rio Santa Cruz watershed the acequia draws from.
    names_individual_acequias: true
    format: "HTML (one acequia)"
    approx_count: 1
  - source: 12
    shows: >
      NM Office of the State Auditor "Tier System of Financial
      Reporting" presentation (via NMDFA). Confirms acequias are "local
      public bodies" subject to the Audit Act's tiered financial
      reporting system (12-6-1 through 12-6-15 NMSA 1978) and are
      eligible, alongside land grants, mutual domestic water consumer
      associations and special districts, for Small Political
      Subdivision funding to cover audit/AUP costs. Does not include a
      list of individual acequias or which ones filed reports for a
      given fiscal year.
    names_individual_acequias: false
    format: "PDF (slide deck)"
    approx_count: null

