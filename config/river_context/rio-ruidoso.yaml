river: Rio Ruidoso
researched: 2026-09-28
# Checked 2026-09-28: 9 statements checked; 2 removed (Wikipedia-only geography claims), 4 reworded (dropped
# an incorrect 1902 period-of-record claim not in USGS site data, trimmed two culture statements to only what
# the tribe's own site supports, and dropped a disputed meeting-frequency detail).

summary:
  - text: "The U.S. Geological Survey measures the river at Hollywood in Lincoln County, where it drains about 120 square miles."
    sources: [2]
summary_sources: [2]

habitats:
  - text: "New Mexico's water quality standards designate the Rio Ruidoso downstream of the U.S. Highway 70 bridge near Seeping Springs lakes for coldwater aquatic life, fish culture and wildlife habitat."
    sources: [3]

culture:
  - text: "The Mescalero people, named for the mescal plant they gathered and ate, were nomadic hunters and gatherers and highly skilled horsemen."
    sources: [4]
  - text: "The Ski Apache ski area is one of the Mescalero Apache Tribe's tribally owned enterprises."
    sources: [4]

users:
  - text: "The same state water quality standards also designate this reach of the Rio Ruidoso for irrigation and livestock watering."
    sources: [3]
  - text: "The USGS operates the Rio Ruidoso gauge at Hollywood in cooperation with the New Mexico Interstate Stream Commission and the Village of Ruidoso."
    sources: [2]
  - text: "The Village of Ruidoso is developing an EPA-funded Rio Ruidoso Watershed-Based Plan to protect water quality and promote sustainable land use, with a Watershed Advisory Board that meets on a recurring schedule."
    sources: [5]

reservoirs_notes: []

sources:
