summary:
  - text: "This Rio Hondo's headwaters rise in the Sangre de Cristo Mountains within the Columbine-Hondo Wilderness, alongside the headwaters of the Red River."
    sources: [2]
  - text: "The Rio Hondo and the Red River are both major tributaries of the upper Rio Grande in northern New Mexico, and their headwaters in the Columbine-Hondo Wilderness supply the downstream agricultural communities of Valdez, Arroyo Hondo, Arroyo Seco, San Cristobal and Questa."
    sources: [2]
summary_sources: [2]

habitats:
  - text: "The river's headwaters lie within the 45,000-acre Columbine-Hondo Wilderness, which ranges from forested slopes home to mule deer, elk, black bears and mountain lions to fragile alpine tundra above treeline that shelters bighorn sheep, marmots and pikas."
    sources: [2]

