summary:
  - text: "The San Francisco River enters New Mexico from Arizona near Luna and leaves the state again downstream of Glenwood."
    sources: [1]
  - text: "In New Mexico the river flows past Reserve and past Glenwood before leaving the state just downstream of Glenwood."
    sources: [1]
  - text: "Senator Martin Heinrich has called the San Francisco, together with the Gila, 'among the last wild, free-flowing rivers in the Southwest,' and both rivers are included in the M.H. Dutch Salmon Greater Gila Wild and Scenic River Act that he and Rep. Gabe Vasquez introduced in Congress; the river also provides critical habitat for the federally threatened spikedace and loach minnow."
    sources: [4, 5]
summary_sources: [1, 4, 5]

habitats:
  - text: "The spikedace and loach minnow, two small native fish listed as threatened under the Endangered Species Act in 1986, have federally designated critical habitat spanning the Gila, San Francisco and other regional rivers across Catron, Grant and Hidalgo counties in New Mexico."
    sources: [5]
  - text: "The Gila trout, spikedace, loach minnow, Chiricahua leopard frog and southwestern willow flycatcher are all federally threatened or endangered species that depend on the aquatic and riparian habitat of the Gila and San Francisco watersheds, according to the New Mexico Environment Department."
    sources: [1]
  - text: "The Wild Gila River coalition describes the Gila headwaters, including the San Francisco River, as the largest network of natural streams in the Southwest and one of the largest undammed headwater watersheds remaining in temperate North America."
    sources: [6]
  - text: "The 2011 Wallow Fire crossed into New Mexico near the town of Luna and left fire debris at every San Francisco River monitoring site, affecting the river's water quality during that summer's monsoon flows, according to a New Mexico Environment Department survey."
    sources: [1]

culture:
  - text: "The Glenwood area lies within the historic territory of Apache leaders Mangas Coloradas, Victorio and Geronimo, according to the New Mexico Tourism Department."
    sources: [7]

users:
  - text: "The U.S. Forest Service manages about 92% of the San Francisco River watershed, with under 1% managed by the Bureau of Land Management and about 7% in private ownership."
    sources: [1]
  - text: "Reserve and Glenwood both sit along the San Francisco River in this sparsely populated part of southwestern New Mexico."
    sources: [1, 7]
  - text: "Under the 2004 Arizona Water Settlements Act, New Mexico had the option to fund new water projects in Catron, Grant, Hidalgo and Luna counties, including a proposed dam and reservoir on the San Francisco River in Weedy Canyon between Reserve and Alma; that dam was dropped from the project's 2019 redesign to cut costs."
    sources: [8]

