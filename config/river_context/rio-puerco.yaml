summary:
  - text: "The Rio Puerco rises along the eastern edge of the Continental Divide near the town of Cuba in west-central New Mexico and flows south through a watershed of roughly 7,350 square miles — the largest tributary basin of the Middle Rio Grande — before joining the Rio Grande at Bernardo."
    sources: [1, 2]
  - text: "In the lower Rio Puerco, arroyo incision had stopped by about 1936: USGS researchers found that in the narrow, already-incised channel, floods eroded the banks more than the streambed, widening the channel rather than deepening it further, while a later decline in flood peak size, frequency and duration after 1941 further limited additional incision."
    sources: [3]
  - text: "The Rio Puerco is best known today for its heavy sediment load: it is the largest suspended-sediment source entering the Rio Grande, and the U.S. Army Corps of Engineers has identified its erosion rates as the highest in the country."
    sources: [4]
summary_sources: [1, 2, 3, 4]

habitats:
  - text: "The Rio Puerco corridor holds BLM-verified habitat for two federally listed birds, the endangered southwestern willow flycatcher and the threatened western yellow-billed cuckoo, both with designated critical habitat there."
    sources: [5]
  - text: "The nonprofit Rio Grande Return is restoring roughly 2.4 miles of degraded stream in the watershed with low-tech, process-based structures meant to slow flows, trap sediment, raise water tables and restore about 90 acres of riparian wetland, with the eventual goal of drawing beavers back to help maintain the habitat."
    sources: [4]

culture:
  - text: "Hispanic settlement of the upper valley began in 1736, when Pedro Barela, Jacinto Barela, Jose Sanchez and Juan Garcia founded Nacimiento — later renamed Cuba — on the banks of the Rio Puerco; a larger group of 36 settlers received the San Joaquin del Nacimiento land grant there in 1769."
    sources: [6]
  - text: "Centuries before Spanish settlement, the valley sheltered Ancestral Puebloan, Mesa Verde-refugee and Gallina communities; Hispanic villages later grew up along the river, including San Luis, Guadalupe, Cabezón and Casa Salazar."
    sources: [7]
  - text: "The village of Guadalupe was eventually abandoned as its water source failed, after 'the once verdant Río Puerco had withered into a deep arroyo.'"
    sources: [7]

users:
  - text: "BLM's Rio Puerco Field Office, based near Albuquerque, manages nearly 1 million acres of public land and administers 3.6 million acres of federal mineral estate across the watershed's wilderness areas, national conservation lands and archaeological sites."
    sources: [8]
  - text: "In December 2024, BLM announced an updated resource management plan for the field office covering livestock grazing, recreation, renewable energy, transportation access and mineral development, along with continued cultural consultation with the region's Tribal Nations."
    sources: [9]
  - text: "The Rio Puerco Management Committee, a collaborative of state, federal, tribal and county agencies formed in 1997 under the Rio Puerco Watershed Act, grew out of a stakeholders group based in Cuba and works to reduce erosion and improve grazing-land condition; project cooperators have included the Navajo Nation and the Pueblo of Jemez."
    sources: [1, 2]
  - text: "Rio Grande Return manages a Rio Puerco restoration site under a Conservation Stewardship Lease with the New Mexico State Land Office, as part of a long-term plan to monitor water quality, groundwater and wildlife habitat there."
    sources: [4]

