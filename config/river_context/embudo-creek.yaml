summary:
  - text: "The valley is known for its centuries-old acequia agriculture and, more recently, for the orchards and vineyards irrigated from the same ditches."
    sources: [3]
summary_sources: [3]

habitats: []

culture:
  - text: "Acequia irrigation remains central to the valley's agricultural heritage, still watering the orchards and vineyards, including La Chiripada Winery, founded in 1977 as New Mexico's oldest winery."
    sources: [3]

users:
  - text: "Acequia water continues to irrigate orchards, farms and vineyards through the Embudo Valley, including La Chiripada and Vivác wineries near Dixon, supporting agriculture that has continued on the same community ditches for centuries."
    sources: [3]
  - text: "A USGS stream gauge at Dixon has tracked Embudo Creek's flow for parts of 93 water years since 1929."
    sources: [4]

