summary:
  - text: "The Mimbres River rises at about 10,000 feet in the Aldo Leopold Wilderness of the Gila National Forest and flows roughly 40 miles across southwestern New Mexico."
    sources: [1]
  - text: "It is a closed-basin desert stream: its surface water never leaves the Mimbres River basin, terminating in the Chihuahuan Desert grasslands near the Mexican border."
    sources: [1]
  - text: "The valley lends its name to the prehistoric Mimbres culture, whose Classic-period potters, working from about 1000 to 1130 CE, produced the distinctive Mimbres Black-on-white pottery the tradition is best known for."
    sources: [2]
summary_sources: [1, 2]

habitats:
  - text: "The Mimbres watershed, from its high-elevation headwaters to the Chihuahuan Desert grasslands near the Mexican border, includes forests of Douglas fir and ponderosa pine, piñon-juniper savanna, desert grasslands and Chihuahuan desert scrub, with riparian forest, cienegas (desert marshes) and springs along stream reaches that are perennial, intermittent or ephemeral."
    sources: [1]
  - text: "The Mimbres River Basin is home to two federally threatened species, the Chihuahua chub and the Chiricahua leopard frog, both of which prefer open-water pools and slow-moving water."
    sources: [3]
  - text: "Starting in 2012, the Nature Conservancy, U.S. Fish and Wildlife Service and New Mexico Department of Game and Fish restored Moreno Spring, a former Mimbres River channel, by digging 14 open-water pools; by August 2016 researchers were finding leopard frog egg masses and more than 100 adult frogs there, and the Chihuahua chub population in the Mimbres has increased since 2020."
    sources: [3]
  - text: "The river also supports cottonwood-willow forest and sacaton floodplain grassland among its riparian habitats, home to species such as the Rio Grande sucker and desert viceroy butterfly."
    sources: [1]

culture:
  - text: "The Classic Mimbres period, from about 1000 to 1130 CE, is defined by Mimbres Black-on-white pottery; the tradition used a highly standardized design layout and symmetry that was unusual for the ancient Southwest, where neighboring groups more often exchanged decorated ceramics to display social ties."
    sources: [2]

users:
  - text: "Irrigated agriculture in the Mimbres Valley diverts water from the river at several points, supporting small apple orchards and a few vineyards, according to a 2013 hydrological characterization of the basin."
    sources: [5]
  - text: "Groundwater pumping to irrigate crops in the desert has dropped the water table 20 to 80 feet near Deming over about 200 square miles, and 20 to 120 feet east of Columbus over about 80 square miles, the same report found."
    sources: [5]

