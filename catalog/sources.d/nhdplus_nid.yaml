sources:
  nhdplus:
    agency: USGS / EPA
    description: >-
      NHDPlus v2 medium-resolution flowlines for the HUC8s in scope: the stream network itself,
      with a COMID per reach, the named-stream identifier (GNIS), Strahler stream order,
      cumulative drainage area, and upstream/downstream topology. Stream, canal, diversion and
      return-flow sites are snapped to their nearest reach (site_reaches table) so gauges can be
      related by position along a channel rather than only by name or by HUC. Also pulls the
      companion nhdwaterbody layer - actual polygons for named reservoirs and lakes (Elephant
      Butte, Navajo, Cochiti, Heron and the rest) with real surface area, and matches
      reservoir/lake sites onto the polygon they fall inside or the nearest one within 2 km
      (site_waterbodies table).
    url: https://api.water.usgs.gov/geoserver/wmadata/ows (via the pynhd/HyRiver client)
    license: Public domain (U.S. Government work). No key, no rate limit observed.
    citation: >-
      U.S. Geological Survey / U.S. EPA, National Hydrography Dataset Plus Version 2 (NHDPlus V2),
      medium resolution, accessed 2026.
    refresh: the network is essentially static; re-fetch with --refresh only if USGS republishes it
    caveats: >-
      Depends on `wbd` having run first (flowlines are fetched by intersecting each in-scope HUC8
      polygon, since the WFS layer does not accept huc8 as a filter property). COMID is the join
      key the National Water Model v2 retrospective uses for feature_id; NWM v3.0 shifted to a
      revised hydrofabric and its feature_ids are not the same COMIDs, so confirm the NWM version
      before joining. The site-to-reach snap is a nearest-neighbour match within 500 m
      (snap_max_distance_m in config/sources.yaml) and is not infallible near confluences or where
      a gauge sits on a short tributary parallel to a larger channel; treat snap_distance_m as a
      confidence signal and spot-check anything used for a load calculation.
  nid:
    agency: US Army Corps of Engineers, National Inventory of Dams
    description: >-
      Dam capacity registry: design (NID) storage, maximum recorded storage, and normal
      (conservation-pool) storage in acre-feet per dam, plus hazard classification, purpose,
      height, and completion year. This is what reservoir_storage observations need a denominator
      from to become a fill percentage; the operational sources (Reclamation, USACE, USGS)
      publish storage, not capacity. Each dam is matched to the nearest NHDPlus waterbody polygon
      within 3 km, which lets capacity join to storage observations via site_waterbodies.comid
      without any name matching.
    url: https://nid.sec.usace.army.mil/api/nation/csv
    license: Public domain (U.S. Government work). No key, single national CSV, no rate limit.
    citation: U.S. Army Corps of Engineers, National Inventory of Dams, accessed 2026.
    refresh: NID is updated periodically; re-fetch with --refresh for a newer snapshot
    caveats: >-
      "Capacity" is not one number. NID Storage is the maximum design/flood-control capacity;
      Normal Storage is what the dam is operated to hold day to day; the two differ enormously for
      flood-control dams built to sit near-empty - Abiquiu is rated at 1,369,000 acre-feet design
      capacity but normally holds around 170,000. Use Normal Storage for an ordinary fill
      percentage and NID Storage only when the question is about flood capacity specifically. The
      waterbody match is nearest-neighbour within 3 km and can be wrong near dam complexes with
      multiple structures on one reservoir (Elephant Butte Dam and Elephant Butte Dike both
      correctly match the same polygon; a cluster of small farm ponds might not). Depends on
      nhdplus having pulled waterbodies first; runs without it but then carries no comid and
      cannot be joined to storage observations. Capacity figures are owner-reported and not
      systematically corrected for sedimentation; NID Storage is usually the original design value
      and the archive's own storage maxima show Elephant Butte holding ~185,000 acre-feet less at
      full pool in the 1980s than in the 1940s. Resurveyed, sediment-corrected capacities are in
      reference.reservoir_acap (usbr_rise --kind acap); prefer that table for any percent-full
      figure. See docs/interpretation.md.
