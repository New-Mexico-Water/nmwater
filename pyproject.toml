[project]
name = "nmwater"
version = "0.1.0"
description = "New Mexico hydrologic data archive: discovery, download, normalization, and catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "openpyxl>=3.1",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "dataretrieval>=1.3",
    "pytz>=2024.1",
]

[project.optional-dependencies]
grids = [
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "rioxarray>=0.17",
    "rasterio>=1.4",
    "zarr>=2.18",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "earthaccess>=0.11",
    "dask>=2024.6",
]
pdf = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
nmwater = "nmwater.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nmwater"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live network endpoints"]
