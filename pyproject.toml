[project]
name = "nmwater"
version = "0.1.0"
description = "New Mexico hydrologic data archive: discovery, download, normalization, and catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "openpyxl>=3.1",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "dataretrieval>=1.3",
    "pytz>=2024.1",
]

[project.optional-dependencies]
grids = [
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "rioxarray>=0.17",
    "rasterio>=1.4",
    "zarr>=2.18",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "earthaccess>=0.11",
    "dask>=2024.6",
]
pdf = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
nmwater = "nmwater.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nmwater"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # Typer declares CLI options as function-call defaults; that is its documented API.
    "B008",
    # Fetchers deliberately catch broadly: one provider's malformed response must not end a run.
    "BLE001",
    # Hydrologic daily values are local calendar dates by definition, not instants.
    "DTZ011",
    # Optional[X] reads better than X | None in the Typer signatures it appears in.
    "UP045",
    "RUF059",
    # Line length is advisory here: several source modules carry long literal URLs and
    # provider parameter lists that read worse when wrapped.
    "E501",
    # zip() without strict= is fine where both sides are built from the same frame.
    "B905",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live network endpoints"]
